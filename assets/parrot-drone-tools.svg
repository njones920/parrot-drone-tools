<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Parrot Drone Tools</title>
  <desc id="desc">A dark avionics banner with radar arcs and a geometric quadcopter.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111722"/><stop offset=".55" stop-color="#182132"/><stop offset="1" stop-color="#211b38"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#15d4c8"/><stop offset="1" stop-color="#8ee36b"/></linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#9db1cb" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/><rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="930" cy="180" r="124" fill="none" stroke="#15d4c8" stroke-opacity=".14"/><circle cx="930" cy="180" r="88" fill="none" stroke="#15d4c8" stroke-opacity=".22"/><circle cx="930" cy="180" r="51" fill="none" stroke="#15d4c8" stroke-opacity=".32"/>
  <path d="M930 180 1057 93" stroke="url(#signal)" stroke-width="3" stroke-linecap="round" opacity=".8"/><path d="M930 180h145M930 180V42" stroke="#8fa4bd" stroke-opacity=".18"/>
  <g fill="none" stroke="url(#signal)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"><path d="M858 161 900 181h60l42-20M900 181l-42 22M960 181l42 22"/><path d="M906 174h48l-8 30h-32z" fill="#182534"/><circle cx="846" cy="155" r="18"/><circle cx="1014" cy="155" r="18"/><circle cx="846" cy="210" r="18"/><circle cx="1014" cy="210" r="18"/></g>
  <circle cx="930" cy="189" r="4" fill="#f3faf9"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="74" y="151" fill="#f4f7fb" font-size="67" font-weight="700" letter-spacing="-2">Parrot Drone Tools</text><text x="78" y="204" fill="#9fb0c5" font-size="24" letter-spacing="3">DRONE &amp; UAV SECURITY FOR PARROT OS</text><rect x="78" y="237" width="415" height="3" rx="2" fill="url(#signal)"/><text x="78" y="279" fill="#7f91a8" font-size="18">Archive-native · repeatable · hardware-agnostic</text></g>
</svg>
